apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: nightly-eval-gpu
  namespace: ml
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 2
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-eval
  namespace: ml
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: eval
            image: registry.example.com/ml/eval:latest
            resources:
              claims:
              - name: gpu
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: nightly-eval-gpu
