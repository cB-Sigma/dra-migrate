apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: trainer-gpu
  namespace: ml
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: ml
  labels:
    app: trainer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      containers:
        - name: trainer
          image: registry.example.com/ml/trainer:1.4.2
          args: ["--epochs", "30"]
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
            limits:
              cpu: "8"
              memory: 64Gi
            claims:
              - name: gpu # one node's worth
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: training-data
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: trainer-gpu
