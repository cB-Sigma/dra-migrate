# Already uses DRA: converting must be a no-op.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migrated
spec:
  selector:
    matchLabels:
      app: migrated
  template:
    metadata:
      labels:
        app: migrated
    spec:
      containers:
      - name: main
        image: registry.example.com/app:1
        resources:
          limits:
            cpu: "2"     # odd   spacing   stays
          claims:
          - name: gpu
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: single-gpu
