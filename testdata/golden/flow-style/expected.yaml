apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: flow-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 2
---
apiVersion: v1
kind: Pod
metadata: {name: flow}
spec:
  containers:
  - name: main
    image: registry.example.com/app:1
    resources: {limits: {cpu: "1"}, claims: [{name: gpu}]}
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: flow-gpu
