apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inference
spec:
  serviceName: inference
  replicas: 3
  selector:
    matchLabels: {app: inference}
  template:
    metadata:
      labels: {app: inference}
    spec:
      containers:
      - name: server
        image: registry.example.com/inference/server:2.1
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: 16Gi
            nvidia.com/gpu: 1
      - name: embedder
        image: registry.example.com/inference/embedder:2.1
        resources:
          limits:
            nvidia.com/gpu: 1
      - name: metrics
        image: registry.example.com/inference/exporter:0.9
        resources:
          limits:
            cpu: 100m
