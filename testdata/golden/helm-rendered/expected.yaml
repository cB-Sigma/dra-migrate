---
# Source: embeddings/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-embeddings
---
# Source: embeddings/templates/rules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: release-embeddings
spec:
  groups:
  - name: embeddings
    rules:
    - alert: GPUIdle
      expr: avg(DCGM_FI_DEV_GPU_UTIL) < 5
      annotations:
        summary: "GPU idle on {{ $labels.instance }}"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: release-embeddings-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
# Source: embeddings/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-embeddings
  labels:
    helm.sh/chart: embeddings-0.3.1
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddings
    spec:
      serviceAccountName: release-embeddings
      runtimeClassName: nvidia
      containers:
        - name: embeddings
          image: "registry.example.com/embeddings/server:0.3.1"
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          resources:
            requests:
              cpu: 4
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: release-embeddings-gpu
