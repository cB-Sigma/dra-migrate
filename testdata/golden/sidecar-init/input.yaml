apiVersion: v1
kind: Pod
metadata:
  name: batch
spec:
  initContainers:
  - name: warmup
    image: registry.example.com/warmup:1
    resources:
      limits:
        nvidia.com/gpu: 1
  - name: gpu-exporter
    image: registry.example.com/exporter:1
    restartPolicy: Always
    resources:
      limits:
        nvidia.com/gpu: 1
  containers:
  - name: main
    image: registry.example.com/app:1
    resources:
      limits:
        nvidia.com/gpu: 0
