apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: both-sides-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: both-sides
spec:
  containers:
  - name: main
    image: registry.example.com/app:1
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: both-sides-gpu
