name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -s -l cmd internal)"
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: make build
      - name: The examples must lint the way the README says
        run: |
          bin/dra-migrate lint examples/after
          if bin/dra-migrate lint --format github examples/before; then
            echo "expected findings in examples/before" >&2
            exit 1
          fi

  apiserver-dry-run:
    name: server-side dry-run (Kubernetes ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.1", "1.37.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Validate every converted fixture against a real kube-apiserver
        run: make dry-run K8S_VERSION=${{ matrix.k8s }}
