apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: notebook-mig-1g-10gb
spec:
  spec:
    devices:
      requests:
      - name: mig
        exactly:
          deviceClassName: mig.nvidia.com
          selectors:
          - cel:
              expression: device.attributes['gpu.nvidia.com'].profile == '1g.10gb'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notebook
  template:
    metadata:
      labels:
        app: notebook
    spec:
      containers:
      - name: jupyter
        image: quay.io/jupyter/pytorch-notebook:cuda12-latest
        resources:
          claims:
          - name: mig-1g-10gb
      resourceClaims:
      - name: mig-1g-10gb
        resourceClaimTemplateName: notebook-mig-1g-10gb
