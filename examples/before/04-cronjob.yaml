apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-eval
  namespace: ml
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: eval
            image: registry.example.com/ml/eval:latest
            resources:
              limits:
                nvidia.com/gpu: "2"
